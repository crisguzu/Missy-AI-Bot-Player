<title id="title">Missy_AI: purpose-driven interaction</title>
<desc id="desc">A human purpose guides a reusable loop: observe, plan, check, act, verify and remember. An environment-specific adapter carries observations, actions and evidence. Minecraft is the first integration; other environments are future targets. Human control bounds every stage.</desc>

<text x="60" y="92" class="heading">Purpose → action → evidence</text>
<rect x="60" y="125" width="1000" height="112" rx="16" fill="#e6effb" stroke="#bdcfe6"/>
<text x="88" y="161" class="label">A purpose defined by people</text>
<text x="88" y="193" class="body">Desired outcome · permission · budget · success evidence · exit conditions</text>
<text x="88" y="219" class="body">Not just “do something” — make useful, measurable progress.</text>

<rect class="node" x="750" y="536" width="280" height="120" rx="12" fill="#f2f4f8"/><text x="774" y="568" class="tag">04</text><text x="810" y="570" class="label">Act</text><text x="774" y="606" class="body">One execution owner</text><text x="774" y="633" class="body">Interruptible effects</text>

<text x="88" y="705" class="body">Reasoning proposes. Independent controls govern. Evidence closes the loop.</text>

<text x="60" y="1091" class="body">Conceptual direction, not a claim of demonstrated cross-environment portability.</text>
